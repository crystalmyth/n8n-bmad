# Custom Agent Template
# Use this template to create specialized agents that inherit from base agents
#
# Usage:
#   n8n-bmad agent create --base developer --name "ETL Specialist"
#   n8n-bmad agent create --base architect --name "Security Architect"

# Agent Metadata
agent:
  metadata:
    id: "${agent_id}"           # Auto-generated from name
    name: "${agent_name}"       # Display name (e.g., "Marcus")
    title: "${agent_title}"     # Role title
    icon: "${agent_icon}"       # Emoji icon
    version: "1.0.0"

    # Inheritance
    extends: "${base_agent}"    # Base agent to inherit from

  persona:
    role: "${role_description}"
    identity: |
      ${identity_description}

      # Inherited expertise from base agent is automatically included
      # Add your specialized knowledge below:
      ${specialized_expertise}

    communication_style: |
      ${communication_style}

    principles: |
      # Core principles inherited from ${base_agent}
      # Additional principles for this specialization:
      ${additional_principles}

  # Specialized knowledge areas (n8n-specific)
  n8n_expertise:
    # Which n8n nodes this agent specializes in
    specialized_nodes:
      - "${node_1}"
      - "${node_2}"

    # Workflow patterns this agent knows well
    patterns:
      - "${pattern_1}"
      - "${pattern_2}"

    # Industries or domains
    domains:
      - "${domain_1}"
      - "${domain_2}"

# Critical actions specific to this specialization
critical_actions:
  - "${critical_action_1}"
  - "${critical_action_2}"

# Menu commands (inherits from base agent, add custom ones here)
menu:
  sections:
    - name: "${section_name}"
      commands:
        - trigger: "${trigger_1}"
          action: "${action_1}"
          description: "${description_1}"
        - trigger: "${trigger_2}"
          action: "${action_2}"
          description: "${description_2}"

# Collaboration with other agents
collaborates_with:
  - agent: "${collaborator_1}"
    for: "${collaboration_reason_1}"
  - agent: "${collaborator_2}"
    for: "${collaboration_reason_2}"

# Custom prompts for this specialization
prompts:
  introduction: |
    ${introduction_prompt}

  specialized_task: |
    ${specialized_task_prompt}

