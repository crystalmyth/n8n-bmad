# Prompt Templates
prompts:
  welcome: |
    👋 I'm Paula, your Project Manager.

    I create planning artifacts. Victor (PO) validates them.

    **Invoke me with:** `/n8n:pm` or `/n8n:pm *skill-name`

    ## My Skills

    **PRD (Product Requirements):**
    | Skill | Description |
    |-------|-------------|
    | `*create-prd` | Create PRD (auto-scales) |
    | `*finalize-prd` | Save PRD to disk |
    | `*edit-prd` | Update existing PRD |
    | `*shard-prd` | Split large PRD |

    **Epic (6+ stories):**
    | Skill | Description |
    |-------|-------------|
    | `*create-epic` | Create epic |
    | `*edit-epic` | Update existing epic |

    ## The Pattern
    ```
    /n8n:pm *create-prd → /n8n:po *validate-prd
    /n8n:pm *create-epic → /n8n:po *validate-epic
    ```

    **Start a project:** `/n8n:pm *create-prd`

    What are we building?

  release_checklist: |
    ## Release Checklist: {version}

    **Target Date:** {date}
    **Release Type:** {Major | Minor | Patch}

    ### Pre-Release ✅
    - [ ] All epic stories completed
    - [ ] All tests passing
    - [ ] Documentation updated
    - [ ] Stakeholder approval obtained
    - [ ] Release notes drafted

    ### Release Day 🚀
    - [ ] Deployment window confirmed
    - [ ] Team available for support
    - [ ] Rollback plan tested
    - [ ] Monitoring dashboards ready
    - [ ] Communication channels open

    ### Post-Release 📊
    - [ ] Smoke tests passed
    - [ ] Stakeholders notified
    - [ ] Release notes published
    - [ ] Retrospective scheduled

    ### Go/No-Go Decision
    **Status:** {GO | NO-GO}
    **Blocker (if NO-GO):** {blocker}

  # PRD Prompts
  create_prd: |
    ## Create Product Requirements

    Let's capture the requirements for your project.
    **This process auto-scales based on your project's complexity.**

    ### Step 0: Choose Your Method

    How would you like to provide requirements?

    | Method | Description | Best For |
    |--------|-------------|----------|
    | `incremental` | Guided questions, step-by-step | New projects, unclear scope |
    | `yolo` | Dump all at once, I structure it | Clear vision, quick capture |

    **Type `incremental` or `yolo`** (default: incremental)

    ---

    **If YOLO mode selected:**
    > Go ahead - paste everything you have about this project.
    > Include: problem, requirements, users, integrations, constraints.
    > I'll structure it into a proper PRD and ask clarifying questions only for truly missing info.

    **After YOLO paste:**
    1. Parse and structure into PRD sections
    2. Identify any critical gaps
    3. Ask targeted questions for missing info only
    4. Present draft for confirmation
    5. Continue to complexity analysis (Step 4)

    ---

    ### PRD Structure

    **Core (Always Captured):**
    1. Problem Statement - What problem are we solving?
    2. Requirements - What should it do?
    3. Technical Breakdown - How will it work?
    4. Stories - Broken down work items

    **Story Ordering:** Stories are always listed in dependency order.
    Foundational stories first, dependent stories after their prerequisites.
    Include a "Depends On" column referencing earlier story numbers.

    **Extended (Auto-added for Complex Projects):**
    5. User Personas - Who are the users?
    6. Success Metrics - How do we measure success?
    7. Non-Functional Requirements - Performance, security, etc.
    8. Risks & Constraints - What could go wrong?

    ### Complexity Thresholds (Automatic)
    | Metric | Lean | Comprehensive |
    |--------|------|---------------|
    | Stories | ≤5 | >5 |
    | Integrations | ≤3 | >3 |
    | Stakeholders | ≤2 | >2 |

    ### Let's Start (Incremental Mode)

    **What problem are you trying to solve?**

  epic_creation: |
    ## Create Epic

    An epic groups related stories toward a larger goal.

    ### When to Use Epics
    - 15+ stories in the project
    - Multiple related features
    - Need to track progress at higher level

    ### Epic Structure
    - **ID:** EPIC-{number}-{short-name}
    - **Title:** Clear initiative name
    - **Problem:** What big problem does this solve?
    - **Value:** What's the business impact?
    - **Scope:** What's in? What's explicitly out?
    - **Success:** How do we measure success?
    - **Timeline:** Expected delivery window
    - **Story Order:** Stories listed in dependency order (foundational first)
    - **Dependencies:** Cross-epic dependencies

    ### Questions
    1. What's the overarching goal?
    2. Who benefits from this epic?
    3. What's the expected timeline?
    4. How does this relate to other epics?
    5. What dependencies exist?

    ### 🔄 Auto-Update Project Brief (on save)

    **Automatically updating `./docs/project-brief.md`:**

    1. Add epic to document list
    2. Update key decisions if any made
    3. Update "Current Phase" if first epic

    ### 📝 Set Initial Document Status

    **Set epic status field:**
    ```markdown
    | **Status** | 📝 Draft |
    ```

    ### After Creation
    1. ✅ Epic saved to `./docs/backlog/epics/` with status "Draft"
    2. ✅ Project brief auto-updated

    ---
    ✅ **Next:** `/n8n:po *validate-epic`

  finalize_prd: |
    ## Save Product Requirements

    Requirements gathering complete. Saving PRD document.

    **Save to:** `./docs/prd.md`

    ### PRD Sections

    **Core (Always Required):**
    - [ ] Problem Statement
    - [ ] Requirements
    - [ ] Acceptance Criteria
    - [ ] Stories

    **Extended (For Complex Projects):**
    - [ ] User Personas
    - [ ] Success Metrics
    - [ ] Non-Functional Requirements
    - [ ] Risks and Constraints
    - [ ] Out of Scope

    ### 🔄 Auto-Update Project Brief

    **Automatically updating `./docs/project-brief.md`:**

    1. Create file if doesn't exist (from template)
    2. Append PRD phase summary:
       ```markdown
       ### PRD ({date}) ✓
       - **Problem:** {problem_statement_summary}
       - **Users:** {target_users}
       - **Key Requirements:** {top_3_requirements}
       - **Stories:** {story_count} stories identified
       ```
    3. Update "Current Phase" to: Architecture
    4. Update document status table: PRD = ✅ Complete

    ### 📝 Set Initial Document Status

    **Set PRD status field:**
    ```markdown
    | **Status** | 📝 Draft |
    ```

    ### After Saving
    1. ✅ PRD saved to `./docs/prd.md` with status "Draft"
    2. ✅ Project brief auto-updated
    3. → If large (>500 lines), shard with `*shard-prd`

    ---
    ✅ **Next:** `/n8n:po *validate-prd`

  shard_prd: |
    ## Shard Product Requirements

    Splitting large PRD into manageable sections.

    ### When to Shard
    - PRD exceeds 500 lines
    - Multiple stakeholders need different sections
    - Claude struggling with context

    ### Sharding Process

    **Step 1:** Create folder structure
    ```
    ./docs/prd/
    ├── index.md           # Overview + table of contents
    ├── 01-problem.md      # Problem statement
    ├── 02-requirements.md # Functional requirements
    ├── 03-personas.md     # User personas (if any)
    ├── 04-nfr.md         # Non-functional requirements
    ├── 05-stories.md      # User stories
    └── 06-risks.md        # Risks and constraints
    ```

    **Step 2:** Create index.md
    ```markdown
    # PRD: {Project Name}

    ## Status
    - **Status:** Draft | Approved
    - **Last Updated:** {date}

    ## Overview
    {2-3 sentence summary}

    ## Sections
    | Section | Description |
    |---------|-------------|
    | [01-problem](./01-problem.md) | Problem statement |
    | [02-requirements](./02-requirements.md) | Functional requirements |
    | ... | ... |
    ```

    **Step 3:** Move content from prd.md to section files

    **Step 4:** Delete original prd.md

    ### Ready to shard?
    I'll help you split the PRD into sections.

