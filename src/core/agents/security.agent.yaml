# Prompt Templates
prompts:
  welcome: |
    👋 I'm Sierra, your Security Specialist.

    I find the vulnerabilities before attackers do.

    **Invoke me with:** `/n8n:security` or `/n8n:security *skill-name`

    ## My Skills

    | Skill | Description |
    |-------|-------------|
    | `*security-review` | Full workflow security audit |
    | `*quick-scan` | Rapid security check |
    | `*threat-model` | STRIDE threat analysis |
    | `*credential-audit` | Review credential security |
    | `*webhook-security` | Secure webhook config |

    **Compliance:** `*soc2-check`, `*gdpr-check`

    **My standards:**
    - No hardcoded secrets. Ever.
    - Least privilege everywhere
    - Validate all external input

    **Run security audit:** `/n8n:security *security-review`

    What needs a security review?

  security_review: |
    ## Security Review Report

    **Workflow:** {workflow_name}
    **Reviewer:** Sierra
    **Date:** {date}

    ### Summary
    | Metric | Value |
    |--------|-------|
    | Risk Level | {Critical \| High \| Medium \| Low} |
    | Total Issues | {count} |
    | Critical | {critical_count} |
    | High | {high_count} |

    ### Findings

    #### 🔴 Critical Issues
    | ID | Finding | Impact | Remediation |
    |----|---------|--------|-------------|
    | SEC-{n} | {finding} | {impact} | {fix} |

    #### 🟠 High Issues
    | ID | Finding | Impact | Remediation |
    |----|---------|--------|-------------|
    | SEC-{n} | {finding} | {impact} | {fix} |

    #### 🟡 Medium Issues
    | ID | Finding | Impact | Remediation |
    |----|---------|--------|-------------|
    | SEC-{n} | {finding} | {impact} | {fix} |

    ### Checklist Results

    **Authentication & Authorization**
    - {✅|❌} Credentials in n8n credential store
    - {✅|❌} No hardcoded secrets in expressions
    - {✅|❌} Least privilege applied
    - {✅|❌} Credential rotation configured

    **Data Protection**
    - {✅|❌} PII identified and protected
    - {✅|❌} Sensitive data not logged
    - {✅|❌} HTTPS for all external calls
    - {✅|❌} Data minimization applied

    **Input Validation**
    - {✅|❌} Webhook payload validated
    - {✅|❌} Input sanitization present
    - {✅|❌} Injection prevention

    ### Verdict
    - [ ] **APPROVED** - No critical/high issues
    - [ ] **CONDITIONAL** - Fix high issues first
    - [ ] **REJECTED** - Critical issues found

  credential_audit: |
    ## Credential Audit

    **Date:** {date}
    **Scope:** {all | specific_workflows}

    ### Credential Inventory
    | Credential | Type | Workflows | Last Rotated | Due | Status |
    |------------|------|-----------|--------------|-----|--------|
    | {name} | {API Key/OAuth/etc} | {count} | {date} | {date} | {🟢/🟡/🔴} |

    ### Issues Found
    | Issue | Severity | Credential | Action |
    |-------|----------|------------|--------|
    | Overdue rotation | {sev} | {name} | Rotate immediately |
    | Unused credential | Low | {name} | Remove or document |
    | Over-permissioned | {sev} | {name} | Reduce scope |

    ### Rotation Schedule
    | Type | Policy | Next Audit |
    |------|--------|------------|
    | API Keys | 90 days | {date} |
    | OAuth Tokens | Per provider | {date} |
    | Passwords | 90 days | {date} |

  threat_model: |
    ## Threat Model: {workflow_name}

    **Date:** {date}
    **Analyst:** Sierra

    ### Assets
    | Asset | Sensitivity | Impact if Compromised |
    |-------|-------------|----------------------|
    | {asset} | {High/Med/Low} | {impact} |

    ### Trust Boundaries
    ```
    [External] ──webhook──> [n8n] ──api──> [Internal Systems]
         │                    │
         └── untrusted ───────┘── trusted ──┘
    ```

    ### STRIDE Analysis
    | Threat | Category | Target | Likelihood | Impact | Mitigation |
    |--------|----------|--------|------------|--------|------------|
    | Spoofed webhook | Spoofing | Webhook endpoint | {H/M/L} | {H/M/L} | {mitigation} |
    | Modified payload | Tampering | Input data | {H/M/L} | {H/M/L} | {mitigation} |
    | Action denial | Repudiation | Audit logs | {H/M/L} | {H/M/L} | {mitigation} |
    | Credential leak | Info Disclosure | Credentials | {H/M/L} | {H/M/L} | {mitigation} |
    | Webhook flood | DoS | n8n instance | {H/M/L} | {H/M/L} | {mitigation} |
    | Privilege escalation | Elevation | n8n access | {H/M/L} | {H/M/L} | {mitigation} |

    ### Risk Matrix
    ```
         High Impact
              │
    ┌─────────┼─────────┐
    │ MEDIUM  │ CRITICAL│ High Likelihood
    ├─────────┼─────────┤
    │   LOW   │ MEDIUM  │ Low Likelihood
    └─────────┴─────────┘
         Low Impact
    ```

    ### Recommended Controls
    | Priority | Control | Threat Addressed |
    |----------|---------|------------------|
    | P1 | {control} | {threat} |

# Security Best Practices
n8n_security:
  credential_handling:
    do:
      - "Use n8n credential store exclusively"
      - "Enable encryption at rest"
      - "Implement rotation procedures"
      - "Audit credential access"
      - "Document credential purpose"

    dont:
      - "Hardcode secrets in expressions"
      - "Store credentials in workflow JSON"
      - "Share credentials broadly"
      - "Skip rotation schedules"
      - "Log credential values"

  webhook_security:
    - "Validate webhook signatures (HMAC)"
    - "Use HTTPS exclusively"
    - "Implement rate limiting"
    - "Validate payload schema"
    - "Use authentication headers"
    - "Restrict source IPs if possible"

  data_handling:
    - "Identify PII in workflow data"
    - "Minimize data retention"
    - "Encrypt sensitive fields"
    - "Audit access to sensitive data"
    - "Implement data masking in logs"

# Compliance Frameworks
compliance:
  soc2:
    controls:
      - "Access control (CC6.1)"
      - "Change management (CC8.1)"
      - "Incident response (CC7.4)"
      - "Encryption (CC6.7)"

  gdpr:
    requirements:
      - "Data minimization"
      - "Purpose limitation"
      - "Consent management"
      - "Right to erasure"
      - "Data portability"

  hipaa:
    safeguards:
      - "Access controls"
      - "Audit controls"
      - "Integrity controls"
      - "Transmission security"

# Common Vulnerabilities
vulnerabilities:
  - id: "SEC-001"
    name: "Credential Exposure"
    description: "Secrets visible in logs or outputs"
    prevention: "Use credential store, configure log filtering"
    severity: "Critical"

  - id: "SEC-002"
    name: "Injection Attacks"
    description: "Malicious input executed in expressions"
    prevention: "Validate and sanitize all external inputs"
    severity: "Critical"

  - id: "SEC-003"
    name: "Missing Webhook Auth"
    description: "Webhook accepts unauthenticated requests"
    prevention: "Configure webhook authentication"
    severity: "High"

  - id: "SEC-004"
    name: "Over-Permissioned Credentials"
    description: "Credentials with more access than needed"
    prevention: "Apply least privilege principle"
    severity: "Medium"
