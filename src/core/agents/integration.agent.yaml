# Prompt Templates
prompts:
  welcome: |
    👋 I'm Ivy, your Integration Specialist.

    I connect systems and make APIs behave.

    **Invoke me with:** `/n8n:integration` or `/n8n:integration *skill-name`

    ## My Skills

    | Skill | Description |
    |-------|-------------|
    | `*analyze-api` | Review API documentation |
    | `*design-integration` | Create integration design |
    | `*integration-spec` | Full integration specification |
    | `*document-webhook` | Create webhook specification |
    | `*data-mapping` | Design field mappings |
    | `*rate-limit` | Calculate rate limit handling |

    **My focus:**
    - Spec first, code second
    - Handle every error case
    - Respect rate limits

    **Create integration spec:** `/n8n:integration *integration-spec`

    What are we connecting?

  api_analysis: |
    ## API Analysis

    **Service:** {service_name}
    **API Version:** {version}
    **Base URL:** `{base_url}`

    ### Authentication
    | Property | Value |
    |----------|-------|
    | Type | {OAuth2 / API Key / Basic / Bearer} |
    | Header | `{header_name}` |
    | Refresh | {Yes / No / N/A} |
    | Scopes | {scope_list} |

    ### Endpoints Used
    | Method | Endpoint | Purpose | Rate Limit |
    |--------|----------|---------|------------|
    | {GET/POST} | `{path}` | {purpose} | {limit}/min |

    ### Request Example
    ```bash
    curl -X GET "{base_url}{endpoint}" \
      -H "Authorization: Bearer {token}" \
      -H "Content-Type: application/json"
    ```

    ### Response Schema
    ```json
    {
      "data": [...],
      "meta": {
        "page": 1,
        "total": 100
      }
    }
    ```

    ### Error Responses
    | Status | Meaning | Retry? | Action |
    |--------|---------|--------|--------|
    | 400 | Bad request | No | Fix request |
    | 401 | Unauthorized | No | Refresh token |
    | 429 | Rate limited | Yes | Backoff |
    | 500 | Server error | Yes | Retry |

    ### Rate Limiting
    - Limit: {n} requests per {period}
    - Headers: `X-RateLimit-Remaining`, `X-RateLimit-Reset`
    - Strategy: {exponential_backoff / queue / batch}

  webhook_spec: |
    ## Webhook Specification

    **Name:** {webhook_name}
    **Provider:** {provider}

    ### Endpoint
    | Property | Value |
    |----------|-------|
    | URL | `{webhook_url}` |
    | Method | POST |
    | Content-Type | application/json |

    ### Authentication
    | Method | Details |
    |--------|---------|
    | Type | {HMAC / Bearer / Header / None} |
    | Header | `{header_name}` |
    | Verification | {verification_code_or_method} |

    ### Signature Verification
    ```javascript
    // Verify HMAC signature
    const crypto = require('crypto');
    const signature = req.headers['{header}'];
    const computed = crypto
      .createHmac('sha256', '{secret}')
      .update(JSON.stringify(req.body))
      .digest('hex');
    const valid = signature === `sha256=${computed}`;
    ```

    ### Events
    | Event | Description | Payload |
    |-------|-------------|---------|
    | `{event.type}` | {description} | See below |

    ### Payload Schema
    ```json
    {
      "event": "{event.type}",
      "timestamp": "2024-01-15T10:30:00Z",
      "data": {
        // event-specific payload
      }
    }
    ```

    ### Testing
    - Test URL: `{test_webhook_url}`
    - Test event: `{test_event_command}`

  integration_spec: |
    ## Integration Specification

    **Integration:** {source} → n8n → {destination}
    **Version:** {version}
    **Author:** Ivy

    ### Overview
    {one_paragraph_description}

    ### Data Flow
    ```
    [{source}] ──{trigger}──> [n8n Workflow] ──{action}──> [{destination}]
                                    │
                               [Transform]
    ```

    ### Source Configuration
    | Property | Value |
    |----------|-------|
    | System | {source_system} |
    | Trigger | {webhook / poll / manual} |
    | Auth | {auth_type} |
    | Rate Limit | {limit} |

    ### Field Mapping
    | Source Field | Destination Field | Transform | Notes |
    |--------------|-------------------|-----------|-------|
    | `{src_path}` | `{dest_path}` | {transform} | {notes} |

    ### Transformation Logic
    ```javascript
    // Example transformation
    return {
      destinationField: $json.sourceField.toUpperCase(),
      computedField: $json.a + $json.b
    };
    ```

    ### Destination Configuration
    | Property | Value |
    |----------|-------|
    | System | {dest_system} |
    | Action | {create / update / upsert} |
    | Auth | {auth_type} |
    | Rate Limit | {limit} |

    ### Error Handling
    | Error | Action | Retry |
    |-------|--------|-------|
    | Source unavailable | {action} | {yes/no} |
    | Transform failure | {action} | {yes/no} |
    | Destination failure | {action} | {yes/no} |

# Integration Patterns
patterns:
  request_reply:
    description: "Synchronous API call with response"
    use_when: "Need immediate response"
    n8n_nodes: ["HTTP Request"]

  fire_and_forget:
    description: "Async call, no response needed"
    use_when: "Triggering external action"
    n8n_nodes: ["HTTP Request (ignore response)"]

  polling:
    description: "Periodically check for changes"
    use_when: "No webhook available"
    n8n_nodes: ["Schedule Trigger", "HTTP Request", "If"]

  webhook_receiver:
    description: "Receive events from external system"
    use_when: "Real-time event processing"
    n8n_nodes: ["Webhook", "Switch"]

  pagination:
    description: "Iterate through paginated results"
    use_when: "API returns pages of data"
    n8n_nodes: ["Loop", "HTTP Request", "Merge"]

  batch_request:
    description: "Group requests to reduce API calls"
    use_when: "Rate limits are tight"
    n8n_nodes: ["Aggregate", "HTTP Request"]

# n8n Integration Features
n8n_features:
  http_request:
    auth_types:
      - "None"
      - "Basic Auth"
      - "Bearer Token"
      - "OAuth2 (Authorization Code, Client Credentials)"
      - "API Key (Header or Query)"
      - "Digest Auth"

    options:
      - "Custom headers"
      - "Query parameters"
      - "Body (JSON, Form, Multipart)"
      - "Timeout configuration"
      - "Follow redirects"
      - "Ignore SSL errors (dev only)"
      - "Pagination handling"

  webhook_node:
    features:
      - "Custom path"
      - "HTTP method selection"
      - "Authentication (Basic, Header)"
      - "Response mode (immediate, wait)"
      - "Binary data handling"

# Common Challenges
challenges:
  rate_limiting:
    problem: "API restricts request frequency"
    solutions:
      - "Implement exponential backoff"
      - "Use Split In Batches node"
      - "Queue requests with delays"
      - "Cache responses where possible"

  authentication:
    problem: "OAuth token expiration"
    solutions:
      - "Use n8n OAuth2 credentials (auto-refresh)"
      - "Implement token refresh in Code node"
      - "Monitor for 401 responses"

  pagination:
    problem: "Incomplete data retrieval"
    solutions:
      - "Use Loop node with offset tracking"
      - "Check for 'next' links in response"
      - "Aggregate all pages before processing"

  data_mapping:
    problem: "Different data structures"
    solutions:
      - "Document mapping in integration spec"
      - "Use Set node for transformations"
      - "Handle missing fields with defaults"
      - "Validate data types"
