# Prompt Templates
prompts:
  welcome: |
    🧠 I'm Petra, your Prompt Engineer.

    I make AI nodes do exactly what you need.

    **Invoke me with:** `/n8n:prompt-engineer` or `/n8n:prompt-engineer *skill-name`

    ## My Skills

    | Skill | Description |
    |-------|-------------|
    | `*system-prompt` | Design system prompt |
    | `*few-shot` | Create few-shot examples |
    | `*ai-agent` | Configure n8n AI Agent node |
    | `*optimize-prompt` | Improve existing prompt |
    | `*evaluate-prompt` | Test and measure quality |
    | `*rag-prompt` | Design RAG prompts |

    **My approach:**
    - Show, don't tell (few-shot > instructions)
    - Test with edge cases
    - Prompts are code - version them

    **Design AI workflow:** `/n8n:prompt-engineer *ai-agent`

    What AI capability are we building?

  system_prompt_design: |
    ## System Prompt Design

    **Purpose:** {what_the_ai_should_do}
    **Model:** {gpt-4/claude/etc}
    **n8n Node:** {AI Agent / OpenAI / Basic LLM Chain}

    ### Context Analysis
    - **Input type:** {user_query / document / data}
    - **Output type:** {text / JSON / structured}
    - **Tone:** {professional / casual / technical}
    - **Constraints:** {length / format / content}

    ### System Prompt Structure
    ```
    ## Role
    You are {specific_role_description}.

    ## Task
    Your job is to {primary_task}.

    ## Guidelines
    - {guideline_1}
    - {guideline_2}
    - {guideline_3}

    ## Output Format
    {format_instructions}

    ## Examples
    {few_shot_if_needed}

    ## Constraints
    - {constraint_1}
    - {constraint_2}
    ```

    ### Draft System Prompt
    ```
    {actual_prompt}
    ```

    ### Test Cases
    | Input | Expected Output | Actual | Pass? |
    |-------|-----------------|--------|-------|
    | {test_1} | {expected_1} | | |
    | {edge_case} | {expected} | | |

  few_shot_design: |
    ## Few-Shot Example Design

    **Task:** {classification / extraction / generation / etc}
    **Target accuracy:** {percentage}

    ### Example Selection Criteria
    - [ ] Representative of common cases
    - [ ] Includes edge cases
    - [ ] Diverse inputs
    - [ ] Clear, unambiguous outputs

    ### Few-Shot Template
    ```
    Here are examples of {task_description}:

    Example 1:
    Input: {input_1}
    Output: {output_1}

    Example 2:
    Input: {input_2}
    Output: {output_2}

    Example 3 (edge case):
    Input: {input_3}
    Output: {output_3}

    Now process this:
    Input: {{$json.input}}
    Output:
    ```

    ### Example Set
    | # | Input | Output | Why Included |
    |---|-------|--------|--------------|
    | 1 | {input} | {output} | Common case |
    | 2 | {input} | {output} | Variation |
    | 3 | {input} | {output} | Edge case |

    ### Optimal Example Count
    - **Simple tasks:** 2-3 examples
    - **Complex tasks:** 4-6 examples
    - **Diminishing returns after:** 8 examples

  ai_agent_config: |
    ## n8n AI Agent Configuration

    **Agent Purpose:** {what_agent_does}
    **Model:** {gpt-4 / claude-3 / etc}

    ### System Message
    ```
    You are {agent_persona}.

    Your capabilities:
    - {capability_1}
    - {capability_2}

    Your constraints:
    - {constraint_1}
    - {constraint_2}

    When using tools:
    - {tool_usage_guideline}

    Response style:
    - {style_guideline}
    ```

    ### Tools Configuration
    | Tool Name | Description | When to Use |
    |-----------|-------------|-------------|
    | {tool_1} | {description} | {trigger_condition} |
    | {tool_2} | {description} | {trigger_condition} |

    ### Tool Description Template
    ```
    Name: {tool_name}
    Description: {what_it_does_and_when_to_use}

    Use this tool when:
    - {condition_1}
    - {condition_2}

    Do NOT use this tool when:
    - {anti_condition}
    ```

    ### Agent Parameters
    | Parameter | Value | Rationale |
    |-----------|-------|-----------|
    | Temperature | {0.0-1.0} | {why} |
    | Max tokens | {number} | {why} |
    | Top P | {0.0-1.0} | {why} |

    ### Test Scenarios
    | Scenario | Expected Behavior | Tools Used |
    |----------|-------------------|------------|
    | {scenario_1} | {behavior} | {tools} |
    | {edge_case} | {behavior} | {tools} |

  optimize_prompt: |
    ## Prompt Optimization

    **Current Prompt:**
    ```
    {existing_prompt}
    ```

    ### Performance Analysis
    | Metric | Current | Target |
    |--------|---------|--------|
    | Accuracy | {%} | {%} |
    | Token cost | {tokens} | {tokens} |
    | Latency | {ms} | {ms} |
    | Edge case handling | {%} | {%} |

    ### Issues Identified
    1. **{issue_1}:** {description}
       - Impact: {impact}
       - Fix: {solution}

    2. **{issue_2}:** {description}
       - Impact: {impact}
       - Fix: {solution}

    ### Optimization Strategies
    - [ ] **Reduce tokens:** {specific_cuts}
    - [ ] **Add structure:** {format_instructions}
    - [ ] **Few-shot examples:** {examples_to_add}
    - [ ] **Clarify constraints:** {constraints}
    - [ ] **Adjust temperature:** {current} → {new}

    ### Optimized Prompt
    ```
    {improved_prompt}
    ```

    ### A/B Test Plan
    | Variant | Change | Hypothesis |
    |---------|--------|------------|
    | A (control) | Current prompt | Baseline |
    | B | {change} | {expected_improvement} |

  evaluate_prompt: |
    ## Prompt Evaluation

    **Prompt Under Test:**
    ```
    {prompt}
    ```

    ### Evaluation Dataset
    | # | Input | Expected Output | Category |
    |---|-------|-----------------|----------|
    | 1 | {input} | {expected} | Happy path |
    | 2 | {input} | {expected} | Edge case |
    | 3 | {input} | {expected} | Adversarial |

    ### Evaluation Criteria
    | Criterion | Weight | Description |
    |-----------|--------|-------------|
    | Accuracy | {%} | Correct output |
    | Format compliance | {%} | Follows structure |
    | Completeness | {%} | All required info |
    | Hallucination | {%} | No made-up facts |
    | Consistency | {%} | Same input → same output |

    ### Results
    | Test | Result | Score | Notes |
    |------|--------|-------|-------|
    | {test_1} | {pass/fail} | {score} | {notes} |

    ### Summary
    - **Overall Score:** {score}/100
    - **Strengths:** {strengths}
    - **Weaknesses:** {weaknesses}
    - **Recommendation:** {ship / iterate / redesign}

  extraction_prompt: |
    ## Data Extraction Prompt

    **Source:** {document_type}
    **Target fields:** {fields_to_extract}

    ### Extraction Prompt Template
    ```
    Extract the following information from the provided text.
    Return the result as JSON.

    Fields to extract:
    - {field_1}: {description} (type: {type})
    - {field_2}: {description} (type: {type})
    - {field_3}: {description} (type: {type})

    Rules:
    - If a field is not found, use null
    - {additional_rule}

    Output format:
    {
      "{field_1}": <value or null>,
      "{field_2}": <value or null>,
      "{field_3}": <value or null>
    }

    Text to process:
    ---
    {{$json.text}}
    ---

    Extracted JSON:
    ```

    ### Example Extraction
    **Input:**
    ```
    {sample_input}
    ```

    **Output:**
    ```json
    {sample_output}
    ```

  rag_prompt: |
    ## RAG Prompt Design

    **Use Case:** {question_answering / search / etc}
    **Knowledge Base:** {description}

    ### RAG Prompt Template
    ```
    You are a helpful assistant that answers questions based on the provided context.

    ## Instructions
    - Answer ONLY based on the provided context
    - If the context doesn't contain the answer, say "I don't have information about that"
    - Quote relevant parts of the context when helpful
    - Be concise but complete

    ## Context
    {context_placeholder}

    ## Question
    {{$json.question}}

    ## Answer
    ```

    ### Context Formatting
    ```
    --- Document 1 ---
    Source: {source}
    Content: {content}

    --- Document 2 ---
    Source: {source}
    Content: {content}
    ```

    ### Handling Edge Cases
    | Scenario | Prompt Addition |
    |----------|-----------------|
    | No relevant context | "If context is insufficient, state that clearly" |
    | Conflicting info | "If sources conflict, note the discrepancy" |
    | Out of scope | "Only answer questions about {domain}" |

# Prompt Patterns
patterns:
  zero_shot:
    description: "Direct instruction without examples"
    use_when: "Simple, well-defined tasks"
    template: |
      {instruction}

      Input: {input}
      Output:

  few_shot:
    description: "Learning from examples"
    use_when: "Complex formats, specific styles, edge cases"
    template: |
      {instruction}

      Examples:
      {examples}

      Input: {input}
      Output:

  chain_of_thought:
    description: "Step-by-step reasoning"
    use_when: "Multi-step problems, math, logic"
    template: |
      {instruction}

      Think through this step by step:
      1. First, ...
      2. Then, ...
      3. Finally, ...

      Input: {input}

      Let me think through this:

  react:
    description: "Reasoning + Acting for agents"
    use_when: "AI agents with tools"
    template: |
      Thought: {reasoning}
      Action: {tool_name}
      Action Input: {tool_input}
      Observation: {tool_output}
      ... (repeat as needed)
      Final Answer: {answer}

  structured_output:
    description: "Force specific output format"
    use_when: "JSON, tables, specific structures"
    template: |
      {instruction}

      Return your response in this exact JSON format:
      ```json
      {
        "field1": "description",
        "field2": "description"
      }
      ```

