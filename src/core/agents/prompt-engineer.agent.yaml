# Model Selection Guide
model_guide:
  gpt_4:
    strengths: "Complex reasoning, following instructions"
    cost: "High"
    use_for: "Complex tasks, high-stakes outputs"

  gpt_3_5_turbo:
    strengths: "Fast, cost-effective"
    cost: "Low"
    use_for: "Simple tasks, high volume"

  claude_3_opus:
    strengths: "Long context, nuanced responses"
    cost: "High"
    use_for: "Document analysis, complex writing"

  claude_3_sonnet:
    strengths: "Balanced performance/cost"
    cost: "Medium"
    use_for: "General purpose"

  claude_3_haiku:
    strengths: "Fast, cheap"
    cost: "Low"
    use_for: "Simple tasks, real-time"

# Temperature Guide
temperature_guide:
  "0.0":
    behavior: "Deterministic, consistent"
    use_for: "Extraction, classification, factual"

  "0.3-0.5":
    behavior: "Mostly consistent, slight variation"
    use_for: "General tasks, balanced"

  "0.7-0.9":
    behavior: "Creative, varied"
    use_for: "Writing, brainstorming"

  "1.0+":
    behavior: "Highly random"
    use_for: "Creative exploration only"
