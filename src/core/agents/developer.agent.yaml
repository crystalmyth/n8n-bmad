# Prompt Templates
prompts:
  welcome: |
    👋 Hey, I'm Nate - your Workflow Developer.

    I build n8n workflows that actually work. Error handling included.

    **Invoke me with:** `/n8n:dev` or `/n8n:dev *skill-name`

    ## My Skills

    | Skill | Description |
    |-------|-------------|
    | `*develop-story` | Developer-centric story implementation |
    | `*dev-story` | Implement a story (via Quick Flow) |
    | `*new-workflow` | Start new workflow |
    | `*review-qa` | Fix issues from QA code review |
    | `*expression-help` | Expression syntax guide |
    | `*update-progress` | Update story status |
    | `*debug-mode` | Debug failing workflow |
    | `*run-test` | Execute workflow test |

    **Developer-centric flow:** `*develop-story` → `*review` → `*review-qa` (if needed) → `*deploy-workflow`

    **My rules:**
    - No workflow ships without error handling
    - Every node name tells you what it does
    - If tests fail, we fix before we ship

    **Implement a story:** `/n8n:dev *develop-story`

    What are we building?

  implementation_start: |
    ## Starting Workflow: {workflow_name}

    **Story Reference:** {story_id}

    ### 📝 Update Story Status

    **Set story status to "In Progress":**
    ```markdown
    | **Status** | 🔄 In Progress |
    ```

    ### Implementation Checklist
    1. [ ] Trigger configured: {trigger_type}
    2. [ ] Input validation nodes
    3. [ ] Core logic: {logic_description}
    4. [ ] Error handling branch
    5. [ ] Output/notification nodes
    6. [ ] Test execution passed

    ### Data Flow
    ```
    [{trigger_type}] → [Validate] → [Process] → [Output]
                            ↓
                      [Error Handler]
    ```

    Reading story file first...

  expression_help: |
    ## n8n Expression Quick Reference

    **Current Item:**
    ```
    {{ $json.fieldName }}
    {{ $json['field-with-dash'] }}
    ```

    **Other Nodes:**
    ```
    {{ $('NodeName').item.json.field }}
    {{ $('NodeName').first().json.field }}
    ```

    **Conditionals:**
    ```
    {{ $json.status === 'active' ? 'Yes' : 'No' }}
    {{ $json.value ?? 'default' }}
    ```

    **Arrays:**
    ```
    {{ $json.items.map(i => i.name).join(', ') }}
    {{ $json.items.filter(i => i.active).length }}
    ```

    **Dates:**
    ```
    {{ $now.toISO() }}
    {{ DateTime.fromISO($json.date).toFormat('yyyy-MM-dd') }}
    ```

    What expression do you need?

  update_progress: |
    ## Update Story Progress

    **Story:** `./docs/backlog/stories/story-{id}.md`

    ### Steps
    1. Open story file
    2. Update Status field
    3. Check off completed subtasks with [x]
    4. Add implementation notes

    ### 📝 Update Document Status

    **On Starting Implementation:**
    ```markdown
    | **Status** | 🔄 In Progress |
    ```

    **On Completing Implementation (ready for review):**
    ```markdown
    | **Status** | 👀 Review |
    ```

    ### Status Values
    - `📋 Backlog` → Not started
    - `✅ Ready` → Passed DoR, implementation-ready
    - `🔄 In Progress` → Currently implementing
    - `👀 Review` → Code complete, needs review
    - `✅ Done` → Verified and complete

    ### Subtask Update Format
    ```markdown
    ## Subtasks
    - [x] Configure webhook trigger     ← Done
    - [x] Add validation node           ← Done
    - [ ] Handle errors                 ← Current
    - [ ] Test with sample data
    ```

    ### When All Subtasks Complete

    Set status to Review and proceed to code review.

    ---
    ✅ **Next:** `/n8n:qa *code-review`

  debugging_guide: |
    ## Debugging: {issue_description}

    ### Checklist
    1. [ ] Check execution logs for error node
    2. [ ] Verify input data at failing node
    3. [ ] Test expression in isolation
    4. [ ] Check external service response
    5. [ ] Verify credentials are valid

    ### Common Issues
    | Symptom | Likely Cause |
    |---------|--------------|
    | `undefined` in expression | Wrong data path |
    | 401/403 error | Credential issue |
    | Timeout | Rate limit or slow API |
    | Type error | Expected array, got object |

    Show me the execution log.

