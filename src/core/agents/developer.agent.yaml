# Code Patterns
patterns:
  retry_with_backoff: |
    // Retry with exponential backoff
    const maxRetries = 3;
    const baseDelay = 1000;

    for (let i = 0; i < maxRetries; i++) {
      try {
        // Operation here
        break;
      } catch (error) {
        if (i === maxRetries - 1) throw error;
        await new Promise(r => setTimeout(r, baseDelay * Math.pow(2, i)));
      }
    }

  batch_processing: |
    // Process in batches of 100
    const batchSize = 100;
    const items = $input.all();
    const results = [];

    for (let i = 0; i < items.length; i += batchSize) {
      const batch = items.slice(i, i + batchSize);
      results.push(...await processBatch(batch));
    }
    return results;

  error_payload: |
    // Standard error notification format
    return {
      workflow: $workflow.name,
      execution: $execution.id,
      error: $json.error?.message ?? 'Unknown error',
      timestamp: $now.toISO(),
      failedNode: $json.error?.node ?? 'Unknown'
    };

  develop_story: |
    ## Develop Story

    **Developer-centric story implementation - you're in control.**

    ### Workflow Chain
    ```
    *develop-story → *review → (*review-qa → *review)* → *deploy-workflow
    Develop → Review → Fix (if needed) → Deploy
    ```

    ### Step 1: Load Story

    **Provide the story:**
    - Story file: `./docs/backlog/stories/{story-file}.md`
    - Story ID: `story-X.Y` or `feat-XXX`

    I'll read the acceptance criteria and create an implementation plan.

    ### Step 2: Implementation Checklist

    Based on the story, I'll create:
    1. [ ] Trigger configuration
    2. [ ] Input validation
    3. [ ] Core logic nodes
    4. [ ] Error handling
    5. [ ] Output/response
    6. [ ] Test execution

    ### Step 3: Update Story Status

    **On start:**
    ```markdown
    | **Status** | 🔄 In Progress |
    ```

    **On complete:**
    ```markdown
    | **Status** | 👀 Review |
    ```

    ### Step 4: Mark Subtasks

    As I complete each part:
    ```markdown
    - [x] Configure webhook trigger ✓
    - [x] Add validation ✓
    - [ ] Handle errors ← Current
    ```

    ---
    ✅ **When done:** Request review with `/n8n:qa *review`

    **What story are we implementing?**

  review_qa: |
    ## Review QA - Address Code Review Feedback

    **Fix issues identified in QA code review.**

    ### Step 1: Load Review Feedback

    **Review sources:**
    - Quick-brief.md review feedback section
    - Story file review notes
    - CR output (if available)

    ### Step 2: Issues to Address

    | Priority | Issue | Location | Fix |
    |----------|-------|----------|-----|
    | 🔴 Critical | {issue} | {node} | {fix} |
    | 🟡 Warning | {issue} | {node} | {fix} |

    ### Step 3: Fix Each Issue

    For each issue:
    1. [ ] Locate the problem node/expression
    2. [ ] Apply the fix
    3. [ ] Test the specific scenario
    4. [ ] Mark as resolved

    ### Step 4: Regression Test

    After fixes:
    - [ ] All original tests still pass
    - [ ] Fixed scenarios now work
    - [ ] No new issues introduced

    ### Step 5: Update Story

    **Mark issues as fixed:**
    ```markdown
    **Review Feedback (resolved):**
    - [x] {issue_1} ✓ Fixed
    - [x] {issue_2} ✓ Fixed
    ```

    ---
    ✅ **When done:** Re-submit for review with `/n8n:qa *review`

    **Paste the review feedback or point me to the quick-brief.md**
