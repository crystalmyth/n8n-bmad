# Menu Commands (Routing & Help only - Master doesn't create documents)
menu:
  - trigger: help
    action: help
    description: "Show help topics and framework guide"

  - trigger: list-agents
    action: list-agents
    description: "Show all available agent personas"

  - trigger: list-templates
    action: list-templates
    description: "Show all document templates"

  - trigger: list-patterns
    action: list-patterns
    description: "Show workflow patterns"

  - trigger: route-agent
    action: route-agent
    description: "Find the right specialist for your task"

  # Quick routing (routes to owning agent)
  - trigger: route-prd
    action: route-to-pm
    description: "→ /n8n:pm *create-prd: Create PRD (auto-scales)"

  - trigger: route-validate-prd
    action: route-to-po
    description: "→ /n8n:po *validate-prd: Validate PRD"

  - trigger: route-architecture
    action: route-to-architect
    description: "→ /n8n:arch *create-architecture: Design architecture"

  - trigger: route-story-draft
    action: route-to-sm
    description: "→ /n8n:sm *story-draft: Draft story with context"

  - trigger: route-validate-story
    action: route-to-po
    description: "→ /n8n:po *validate-story: Validate story"

  - trigger: route-dev-story
    action: route-to-quick-flow
    description: "→ /n8n:dev *dev-story: Implement story"

  - trigger: route-code-review
    action: route-to-qa
    description: "→ /n8n:qa *code-review: Code review"

  - trigger: correct-course
    action: route-to-owner
    description: "Route to document owner for changes"

  # Project Brief Management (prevents context loss)
  - trigger: update-brief
    action: update-brief
    description: "Manual update (auto-updates on finalize/validate)"

  - trigger: resume-context
    action: resume-context
    description: "Load project brief and continue where you left off"

  - trigger: view-brief
    action: view-brief
    description: "Display current project brief"

# Prompt Templates
prompts:
  welcome: |
    👋 I'm Atlas, your n8n-BMAD Master Orchestrator.

    **Agent + Skill Pattern (Primary Interface):**
    ```
    /n8n:agent *skill    ← Self-documenting
    /n8n:agent           ← Show all skills for agent
    ```

    **The Essential Flow (PM creates → PO validates):**
    | Step | Agent + Skill | What It Does |
    |------|---------------|--------------|
    | 1 | `/n8n:pm *create-prd` | Create requirements (auto-scales) |
    | 2 | `/n8n:po *validate-prd` | Validate PRD |
    | 3 | `/n8n:arch *create-architecture` | Design architecture |
    | 4 | `/n8n:sm *story-draft` | Draft stories with context |
    | 5 | `/n8n:po *validate-story` | Validate stories |
    | 6 | `/n8n:dev *dev-story` | Implement a story |
    | 7 | `/n8n:qa *code-review` | Code review |

    **Start any project:** `/n8n:pm *create-prd`

    **Discover agent skills:**
    - `/n8n:pm` - Show PM skills (PRD, epic)
    - `/n8n:po` - Show PO skills (validate everything)
    - `/n8n:sm` - Show SM skills (draft stories, ceremonies)
    - `/n8n:dev` - Show Developer skills

    I route work to the right specialist:
    - Paula (PM) - Creates PRD, Epic
    - Victor (PO) - Validates everything
    - Sam (SM) - Drafts stories
    - Winston (Architect) - Solution Design
    - Barry (Quick Flow) - Implementation

    What are you building?

  agent_list: |
    ## n8n-BMAD Team

    ### Essential Commands (Agent + Skill)
    | Agent + Skill | What It Does |
    |---------------|--------------|
    | `/n8n:pm *create-prd` | Create requirements |
    | `/n8n:po *validate-prd` | Validate PRD |
    | `/n8n:arch *create-architecture` | Design architecture |
    | `/n8n:sm *story-draft` | Draft stories |
    | `/n8n:po *validate-story` | Validate stories |
    | `/n8n:dev *dev-story` | Implement story |
    | `/n8n:qa *code-review` | Code review |

    ### Role Separation (PM creates → PO validates)
    | Document | Created By | Validated By |
    |----------|------------|--------------|
    | PRD | `/n8n:pm *create-prd` | `/n8n:po *validate-prd` |
    | Epic | `/n8n:pm *create-epic` | `/n8n:po *validate-epic` |
    | Story | `/n8n:sm *story-draft` | `/n8n:po *validate-story` |

    ### All Agents
    | Agent | Name | Invoke | Role |
    |-------|------|--------|------|
    | PM | Paula 📋 | `/n8n:pm` | Creates PRD, epic |
    | PO | Victor 📦 | `/n8n:po` | Validates everything |
    | SM | Sam 🏃 | `/n8n:sm` | Drafts stories, ceremonies |
    | Architect | Winston 🏗️ | `/n8n:arch` | Design, patterns |
    | Developer | Nate 💻 | `/n8n:dev` | Implementation |
    | QA | Quinn 🧪 | `/n8n:qa` | Testing, bugs |
    | DevOps | Rex 🚀 | `/n8n:devops` | Deploy, environments |
    | Security | Sierra 🔒 | `/n8n:security` | Security, compliance |
    | Quick Flow | Barry ⚡ | `/n8n:quick-flow` | Fast implementation |

    **Start any project:** `/n8n:pm *create-prd`

  route_recommendation: |
    ## Routing Recommendation

    **Your Request:** {request_summary}

    **Recommended Agent:** {agent_name} ({agent_role})

    **Why:** {routing_reason}

    **Key Commands:**
    {agent_commands}

    **Alternative:** {alternative_if_applicable}

    Would you like me to switch to {agent_name}?

  quick_vs_full: |
    ## How It Works

    **One entry point:** `/n8n:pm *create-prd`

    The framework auto-scales based on your project:

    | Project Size | PRD Style | Flow |
    |--------------|-----------|------|
    | Simple (1-5) | Lean | `/n8n:pm *create-prd` → `/n8n:dev *dev-story` |
    | Standard (6-15) | Comprehensive | `/n8n:pm *create-prd` → `/n8n:po *validate-prd` → `/n8n:arch *create-architecture` → `/n8n:pm *create-epic` → `/n8n:po *validate-epic` → `/n8n:sm *story-draft` → `/n8n:po *validate-story` |
    | Enterprise (15+) | Comprehensive | Same + multiple epics |

    **Pattern: PM creates → PO validates**

    **Start with:** `/n8n:pm *create-prd`

  update_brief: |
    ## Update Project Brief

    **File:** `./docs/project-brief.md`

    ### ✅ Auto-Updates (On Phase Completion)

    The project brief **automatically updates** when you:
    - Finalize PRD (`*finalize-prd`) → Adds PRD phase summary
    - Save Architecture (`*save-architecture`) → Adds architecture phase summary
    - Create Epic (`*create-epic`) → Adds epic info
    - Complete Story (after `*code-review`) → Updates current task
    - Deploy (`*deploy-workflow`) → Logs deployment milestone

    ### When to Use *update-brief Manually

    Use `*update-brief` to add:
    - Key decisions (ADRs, architectural choices)
    - Important context not captured automatically
    - Custom notes for future sessions

    ### What Gets Updated
    - Completed Phases (with summaries)
    - Current Phase and task
    - Key Decisions list
    - Document locations

    Updating project brief now...

  resume_context: |
    ## Resume Session

    **Checking for project state files...**

    ### Resume Process (Priority Order)

    **Step 1:** Check for Quick Brief first (Quick Flow)
    ```
    ./docs/quick-brief.md exists?
    ├── YES → Load Quick Flow context, route to Barry
    └── NO  → Check for project-brief.md
    ```

    **Step 2:** Check for Project Brief (Full Process)
    ```
    ./docs/project-brief.md exists?
    ├── YES → Load full process context
    └── NO  → Discover from existing docs
    ```

    **Step 3:** If neither exists, discover state from docs:
    - PRD exists? → Read PRD, phase is Architecture
    - Architecture exists? → Phase is Stories
    - Stories exist? → Phase is Implementation
    - Create initial brief from discovered state

    ### Quick Brief Found (Quick Flow)

    **Route to Barry (Quick Flow):**
    ```
    📋 Quick Brief Found: ./docs/quick-brief.md

    This is a Quick Flow project (minimal ceremony).

    → Running *load-brief to restore context...
    ```

    **Then display:**
    ```
    ⚡ Quick Flow Context Loaded

    **Project:** {goal}
    **Story:** {story_title}
    **Status:** {status}
    **Continue From:** {current_subtask}

    **Next:** Run `*dev-story` to continue or `*code-review` if ready for review
    ```

    ### Project Brief Found (Full Process)

    **Load full process context:**
    ```
    📋 Project Brief Found: ./docs/project-brief.md

    📋 Project: {name}
    🎯 Goal: {goal}
    📍 Phase: {current_phase}
    📝 Working on: {current_task}
    ➡️  Next: {next_steps}
    ```

    ### No Brief Found

    **Discover state and recommend:**
    ```
    ⚠️ No brief file found

    **Checking existing docs...**

    | Document | Found? |
    |----------|--------|
    | PRD | {yes/no} |
    | Architecture | {yes/no} |
    | Stories | {yes/no} |

    **Recommended:** {recommended_action}
    ```

    Let me check your project state...

  view_brief: |
    ## View Project Brief

    Reading `./docs/project-brief.md`

    This shows:
    - Project overview
    - All completed phases with summaries
    - Key decisions made
    - Current work status
    - Document locations

    Displaying project brief...

# Routing Logic
routing:
  rules:
    - keywords: ["PRD", "requirements", "product requirements", "shard PRD"]
      agent: pm
      reason: "PM owns PRD lifecycle (create, validate, shard)"

    - keywords: ["backlog", "story", "epic", "acceptance criteria", "user story"]
      agent: po
      reason: "PO owns backlog (epics, stories, acceptance criteria)"

    - keywords: ["epic", "release", "timeline", "status", "capacity"]
      agent: pm
      reason: "Project and epic management"

    - keywords: ["standup", "retro", "ceremony", "impediment", "blocker"]
      agent: sm
      reason: "Agile ceremonies and team facilitation"

    - keywords: ["architecture", "design", "pattern", "ADR", "technical decision"]
      agent: architect
      reason: "Architecture and technical design"

    - keywords: ["implement", "build", "code", "expression", "workflow", "node"]
      agent: developer
      reason: "Workflow implementation"

    - keywords: ["test", "QA", "bug", "quality", "validation"]
      agent: qa
      reason: "Testing and quality assurance"

    - keywords: ["deploy", "environment", "incident", "pipeline", "monitoring"]
      agent: devops
      reason: "Operations and deployment"

    - keywords: ["security", "credential", "compliance", "audit", "vulnerability"]
      agent: security
      reason: "Security and compliance"

    - keywords: ["API", "webhook", "integration", "endpoint", "authentication"]
      agent: integration
      reason: "API and integration work"

    - keywords: ["data", "transform", "schema", "mapping", "quality rules"]
      agent: data-analyst
      reason: "Data analysis and transformation"

    - keywords: ["document", "runbook", "KB", "docs", "write"]
      agent: tech-writer
      reason: "Documentation"

    - keywords: ["quick", "fast", "simple", "solo", "minimal"]
      agent: quick-flow
      reason: "Fast implementation with minimal ceremony"

    - keywords: ["process", "ROI", "analysis", "research", "stakeholder"]
      agent: ba
      reason: "Business analysis"

    - keywords: ["prompt", "AI", "LLM", "system message", "few-shot", "GPT", "Claude", "agent persona"]
      agent: prompt-engineer
      reason: "AI prompt engineering"
