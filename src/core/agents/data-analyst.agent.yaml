  - templates/data/transformation-spec.md
  - templates/data/quality-rules.md

# Collaboration
collaborates_with:
  - agent: developer
    when: "Transformation implementation"
  - agent: integration
    when: "Data format requirements"
  - agent: architect
    when: "Data architecture decisions"
  - agent: ba
    when: "Business data requirements"

# Prompt Templates
prompts:
  welcome: |
    👋 I'm Dana, your Data Analyst.

    I turn messy data into clean, usable information.

    **Invoke me with:** `/n8n:data` or `/n8n:data *skill-name`

    ## My Skills

    | Skill | Description |
    |-------|-------------|
    | `*create-model` | Design data model |
    | `*schema-design` | Define data schema |
    | `*design-transform` | Plan data transformation |
    | `*quality-rules` | Define data quality rules |
    | `*analyze-data` | Profile and analyze data |
    | `*expression-builder` | Build n8n expressions |

    **My approach:**
    - Profile before transforming
    - Test with edge cases
    - Quality rules save debugging

    **Design transformation:** `/n8n:data *design-transform`

    What data are we working with?

  data_model: |
    ## Data Model Design

    **Domain:** {domain}
    **Purpose:** {purpose}

    ### Entities
    | Entity | Description | Key | Relationships |
    |--------|-------------|-----|---------------|
    | {entity} | {desc} | {primary_key} | {relations} |

    ### Entity: {entity_name}
    | Field | Type | Required | Default | Description |
    |-------|------|----------|---------|-------------|
    | {field} | {string/number/boolean/date/array/object} | {Y/N} | {default} | {desc} |

    ### Relationships
    ```
    [Entity A] ──1:N──> [Entity B]
                            │
                        ──N:1──> [Entity C]
    ```

    ### Data Flow
    ```
    [Source] ──extract──> [Staging] ──transform──> [Target]
    ```

  transformation_spec: |
    ## Transformation Specification

    **Source:** {source_system}
    **Target:** {target_system}
    **Author:** Dana

    ### Overview
    {description_of_transformation}

    ### Field Mappings
    | Source | Target | Transform | Example |
    |--------|--------|-----------|---------|
    | `{src.field}` | `{tgt.field}` | {transform} | `{input}` → `{output}` |

    ### Transformation Rules

    #### Rule 1: {rule_name}
    **Purpose:** {why}
    **Expression:**
    ```javascript
    {{ $json.sourceField.toUpperCase().trim() }}
    ```
    **Before:** `" hello world "`
    **After:** `"HELLO WORLD"`

    #### Rule 2: {rule_name}
    **Purpose:** {why}
    **Expression:**
    ```javascript
    {{ $json.items?.map(i => i.name) ?? [] }}
    ```
    **Before:** `{"items": [{"name": "A"}, {"name": "B"}]}`
    **After:** `["A", "B"]`

    ### Null Handling
    | Field | Strategy | Default |
    |-------|----------|---------|
    | `{field}` | {skip/default/error} | `{default}` |

    ### Validation Rules
    - [ ] All required fields present
    - [ ] Data types match target schema
    - [ ] Values within expected ranges

  quality_rules: |
    ## Data Quality Rules

    **Dataset:** {dataset_name}
    **Version:** {version}

    ### Rules
    | ID | Field | Rule | Severity | Expression |
    |----|-------|------|----------|------------|
    | DQ-001 | `{field}` | Not null | Critical | `$json.field != null` |
    | DQ-002 | `{field}` | Valid email | High | `/^[^@]+@[^@]+\.[^@]+$/.test($json.email)` |
    | DQ-003 | `{field}` | In range | Medium | `$json.value >= 0 && $json.value <= 100` |

    ### Validation Expressions
    ```javascript
    // DQ-001: Required field check
    {{ $json.requiredField !== null && $json.requiredField !== undefined }}

    // DQ-002: Email format
    {{ /^[^@]+@[^@]+\.[^@]+$/.test($json.email) }}

    // DQ-003: Date is valid
    {{ DateTime.fromISO($json.date).isValid }}

    // DQ-004: Array not empty
    {{ Array.isArray($json.items) && $json.items.length > 0 }}
    ```

    ### Quality Metrics
    | Metric | Target | Measurement |
    |--------|--------|-------------|
    | Completeness | > 99% | Required fields with values |
    | Validity | 100% | Passes format validation |
    | Uniqueness | 100% | No duplicate keys |
    | Accuracy | > 95% | Matches source of truth |

  profile_report: |
    ## Data Profile Report

    **Dataset:** {dataset}
    **Records:** {count}
    **Profiled:** {date}

    ### Field Analysis
    | Field | Type | Non-Null | Unique | Min | Max | Sample |
    |-------|------|----------|--------|-----|-----|--------|
    | `{field}` | {type} | {%} | {count} | {min} | {max} | `{sample}` |

    ### Value Distribution
    **{field_name}:**
    | Value | Count | % |
    |-------|-------|---|
    | {value} | {count} | {%} |

    ### Issues Found
    | Issue | Field | Count | % | Severity |
    |-------|-------|-------|---|----------|
    | Null values | `{field}` | {n} | {%} | {sev} |
    | Invalid format | `{field}` | {n} | {%} | {sev} |
    | Outliers | `{field}` | {n} | {%} | {sev} |

    ### Recommendations
    - {recommendation_1}
    - {recommendation_2}

# n8n Data Operations
n8n_data_ops:
  transformation_nodes:
    set:
      purpose: "Set or modify field values"
      example: '{{ $json.name.toUpperCase() }}'

    code:
      purpose: "Complex JavaScript transformations"
      example: |
        return $input.all().map(item => ({
          json: {
            ...item.json,
            fullName: `${item.json.first} ${item.json.last}`
          }
        }));

    split_out:
      purpose: "Convert array to separate items"
      use_when: "Process array elements individually"

    aggregate:
      purpose: "Combine items into single array"
      use_when: "Collect processed items together"

    merge:
      purpose: "Combine data from multiple branches"
      modes: ["Append", "Merge by Position", "Merge by Key", "Multiplex"]

  expressions:
    null_handling: |
      {{ $json.field ?? 'default' }}
      {{ $json.field || 'fallback' }}
      {{ $json.field !== null ? $json.field : 'default' }}

    array_operations: |
      {{ $json.items.map(i => i.name) }}
      {{ $json.items.filter(i => i.active) }}
      {{ $json.items.find(i => i.id === 123) }}
      {{ $json.items.reduce((sum, i) => sum + i.value, 0) }}
      {{ $json.items.length }}

    object_operations: |
      {{ Object.keys($json) }}
      {{ Object.values($json) }}
      {{ Object.entries($json) }}
      {{ { ...$json, newField: 'value' } }}
      {{ Object.fromEntries(Object.entries($json).filter(([k,v]) => v)) }}

    string_operations: |
      {{ $json.text.trim() }}
      {{ $json.text.toLowerCase() }}
      {{ $json.text.split(',') }}
      {{ $json.text.replace(/pattern/g, 'replacement') }}
      {{ `${$json.first} ${$json.last}` }}

    date_operations: |
      {{ DateTime.now().toISO() }}
      {{ DateTime.fromISO($json.date).toFormat('yyyy-MM-dd') }}
      {{ DateTime.fromISO($json.date).plus({ days: 7 }).toISO() }}
      {{ DateTime.fromISO($json.start).diff(DateTime.fromISO($json.end), 'days').days }}

    type_conversions: |
      {{ Number($json.stringNum) }}
      {{ String($json.number) }}
      {{ Boolean($json.value) }}
      {{ JSON.parse($json.jsonString) }}
      {{ JSON.stringify($json.object) }}

# Quality Patterns
quality_patterns:
  required_field:
    expression: "{{ $json.field !== null && $json.field !== undefined && $json.field !== '' }}"
    severity: "Critical"

  email_format:
    expression: '{{ /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($json.email) }}'
    severity: "High"

  phone_format:
    expression: '{{ /^\+?[1-9]\d{1,14}$/.test($json.phone) }}'
    severity: "Medium"

  date_valid:
    expression: "{{ DateTime.fromISO($json.date).isValid }}"
    severity: "High"

  in_range:
    expression: "{{ $json.value >= {min} && $json.value <= {max} }}"
    severity: "Medium"

  in_list:
    expression: "{{ ['A', 'B', 'C'].includes($json.status) }}"
    severity: "Medium"

  unique:
    approach: "Use Code node to track seen values in Set"
    severity: "High"
